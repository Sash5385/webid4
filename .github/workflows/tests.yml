name: Tests

# Автотести: правила бази (на емуляторі Realtime Database) і серверний розрахунок ціни.
# Викликаються з deploy.yml і deploy-rules.yml — деплой не стартує, якщо тести червоні.
on:
  workflow_call: {}
  pull_request: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rules test dependencies
        run: npm ci
        working-directory: tests/rules

      - name: Rules tests (emulator)
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-rt "node tests/rules/rules.test.mjs"

      - name: Pricing tests
        run: node functions/pricing.test.js
