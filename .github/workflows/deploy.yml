name: Deploy to Firebase

on:
  push:
    branches:
      - master

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting and all Cloud Functions
        # Правила бази (database) тут НЕ деплояться: вони залежать від нових функцій і нових
        # клієнтів (bookedBy, queue_counts), тому виходять ОКРЕМО і останніми — вручну через
        # workflow «Deploy Database Rules» (Actions → Run workflow), коли клієнти вже оновились.
        # --force: non-interactive CI can't answer the "delete stale functions?" prompt,
        # so without it firebase-tools aborts the ENTIRE deploy (hosting release included)
        # whenever a function was removed from source but still exists in the project.
        run: npx firebase-tools deploy --only hosting:admin,functions --force --token "${{ secrets.FIREBASE_TOKEN }}"
